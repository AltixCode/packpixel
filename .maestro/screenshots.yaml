appId: com.altixcode.packpixel
name: Store screenshots
---
# Store screenshots have to show the product doing its job. An empty queue and
# a stock hero sell nothing, and Apple rejects shots that do not match the
# build, so these come from driving the real app over the real fixtures.
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 01-hero

- tapOn: ".*Select Product Photos.*"
# Waited for, not assumed, and optional so the iPad can fall through: the
# branch conditions below are evaluated once with no wait of their own, so
# without this the iPhone takes the iPad path whenever the picker is a moment
# slow to present.
- extendedWaitUntil:
    visible:
      id: "photosView_content_scroll_view"
    timeout: 20000
    optional: true

# The picker differs enough between the two devices that it needs two paths.
#
# On iPhone it is presented full screen and exposes its grid to accessibility,
# so the wait below is a real anchor: a looser text wait like ".*Photos.*" also
# matches the app's own button and passes before the picker exists.
#
# On iPad it is a popover, and its contents are not in the accessibility tree at
# all -- the only element there is a "dismiss popup" region. Nothing can be
# waited on or matched, so that path is driven by position, which is stable for
# a fixed device and runtime.
- runFlow:
    when:
      visible:
        id: "photosView_content_scroll_view"
    commands:
      - waitForAnimationToEnd:
          timeout: 8000
      - tapOn:
          point: "17%,23%"
      - waitForAnimationToEnd:
          timeout: 2500
      - tapOn:
          point: "50%,23%"
      - waitForAnimationToEnd:
          timeout: 2500
      - tapOn:
          point: "83%,23%"
      - waitForAnimationToEnd:
          timeout: 2500
      - tapOn:
          point: "91%,11%"
- runFlow:
    when:
      notVisible:
        id: "photosView_content_scroll_view"
    commands:
      # Three settles, not one. waitForAnimationToEnd returns as soon as the
      # screen stops moving, which happens before the picker's grid is
      # interactive: a tap that lands in that window is delivered and does
      # nothing, and the flow carries on with no photos selected.
      - waitForAnimationToEnd:
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 10000
      - waitForAnimationToEnd:
          timeout: 10000
      - tapOn:
          point: "39%,35%"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: "51%,35%"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          point: "62%,35%"
      - waitForAnimationToEnd:
          timeout: 3000
      # The checkmark at the top right, which is what confirms on iPad. The
      # button along the bottom reads "Show Selected" and only filters the grid.
      - tapOn:
          point: "87%,28%"
- extendedWaitUntil:
    visible: ".*Configure Batch.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-queue

- tapOn: ".*Configure Batch.*"
- extendedWaitUntil:
    visible: ".*(Amazon|eBay|Etsy).*"
    timeout: 25000
- tapOn: ".*Amazon.*"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: 03-presets

- scrollUntilVisible:
    element:
      text: ".*Process \\d+ Photos.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: 04-options
- tapOn: ".*Process \\d+ Photos.*"
- extendedWaitUntil:
    visible: ".*Batch Export Complete.*"
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: 05-complete
